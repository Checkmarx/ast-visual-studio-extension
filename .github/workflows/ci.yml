name: Checkmarx One visual studio extension CI

on: [ pull_request, workflow_dispatch ]

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  integration-tests:
    name: Integration Tests
    runs-on: cx-public-windows-2022-x64
    permissions:
      contents: read
    steps:
      - name: Fetch Sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      # Locate the runner's own vstest.console.exe instead of a third-party action (blocked by the
      # StepSecurity limit-allowed-github-actions policy).
      - name: Add VSTest to PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vstest = & $vswhere -latest -products * -requires Microsoft.VisualStudio.PackageGroup.TestTools.Core -find "Common7\IDE\CommonExtensions\Microsoft\TestWindow\vstest.console.exe" | Select-Object -First 1
          if (-not $vstest) { throw "vstest.console.exe not found on this runner" }
          Split-Path $vstest | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Add MSBuild to PATH
        uses: step-security/setup-msbuild@f01243490939309baa8e659042bec579fa10db95 # v2.0.1
        with:
          vs-version: '17.2'
          
      - name: Install .NET 6.0 Windows Desktop Runtime
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '6.0.x'
          include-prerelease: false

      - name: Restore NuGet packages
        run: nuget restore .

      - name: Restore
        run: dotnet restore . 
      
      - name: Build
        run: msbuild /p:Configuration=Release /p:DeployExtension=False
        
      - name: Tests
        env:
          CX_APIKEY: ${{ secrets.CX_APIKEY }}
        run: vstest.console.exe /InIsolation .\ast-visual-studio-extension-tests\bin\Release\net60-windows\ast-visual-studio-extension-tests.dll
        
       
