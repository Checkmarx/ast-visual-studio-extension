name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Dev release tag'
        required: true
        type: string
      dev:
        description: 'Is dev build'
        required: false
        default: true
        type: boolean
      cliTag:
        description: 'Version of the CLI to bundle'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Dev release tag'
        required: true
        type: string
      dev:
        description: 'Is dev build'
        required: false
        default: true
        type: boolean
      cliTag:
        description: 'Version of the CLI to bundle'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Build and Release VSIX
    runs-on: cx-public-windows-2022-x64
    environment: release
    permissions:
      contents: write  # for git push tag and create release
    outputs:
      CLI_VERSION: ${{ steps.extract_cli_version.outputs.CLI_VERSION }}
    steps:
      - name: Fetch Sources
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: step-security/setup-msbuild@f01243490939309baa8e659042bec579fa10db95 # v2.0.1
        with:
          vs-version: '17.2'
      
      - name: Install wget
        run: |
          choco install wget --no-progress

      - name: Download CLI
        if: inputs.cliTag
        shell: bash
        env:
          CLI_TAG: ${{ inputs.cliTag }}
        run: |
          chmod +x ./.github/scripts/update_cli.sh
          ./.github/scripts/update_cli.sh "${CLI_TAG}"

      - name: Extract CLI version
        id: extract_cli_version
        shell: bash
        run: |
          CLI_VERSION=$(./ast-visual-studio-extension/CxWrapper/Resources/cx.exe version | grep -Eo '^[0-9]+\.[0-9]+\.[0-9]+')
          echo "CLI version being packed is $CLI_VERSION"
          echo "CLI_VERSION=$CLI_VERSION" >> $GITHUB_ENV
          echo "::set-output name=CLI_VERSION::$CLI_VERSION"
          
      - name: Set release version
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          echo "${TAG}"
          echo "RELEASE_VERSION=${TAG}" >> $GITHUB_ENV

      - name: Tag
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TAG: ${{ inputs.tag }}
        with:
          script: |
            const tag = process.env.TAG;
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${tag}`,
              sha: context.sha
            });
            core.info(`Created tag ${tag} at ${context.sha}`);

      - name: Increment VSIX version
        shell: bash
        env:
          VERSION: ${{ inputs.tag }}
        run: |
          version="${VERSION}"
          manifest="ast-visual-studio-extension/source.extension.vsixmanifest"
          sed -i "s/\(Identity[^>]*Version=\"\)[^\"]*\"/\1$version\"/" "$manifest"
          echo "Updated VSIX version to $version"

      - name: Restore NuGet packages
        run: msbuild -t:restore
      
      - name: Build
        run: msbuild .\ast-visual-studio-extension\ast-visual-studio-extension.csproj /p:Configuration=Release /p:DeployExtension=False

      - name: Create Release
        uses: step-security/action-gh-release@277bfa82abcfdb73e5bbb19e213fd76532ee2be5 # v3.0.0
        with:
          tag_name: ${{ inputs.tag }}
          prerelease: ${{ inputs.dev }}
          generate_release_notes: true
          files: '**/Release/ast-visual-studio-extension.vsix'

      # - name: Publish Release
      #   uses: cezarypiatek/VsixPublisherAction@9c6b58b5955df9901a6e9834be1d0a94cd54aeba #1.0
      #   if: inputs.dev == false
      #   with:
      #     extension-file: '.\ast-visual-studio-extension\bin\Release\ast-visual-studio-extension.vsix'
      #     publish-manifest-file: '.\vs-publish.json'
      #     personal-access-code: ${{ secrets.VS_PUBLISHER_ACCESS_TOKEN }}

  # notify:
